<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f3eee5; }
  #root { width: 100%; height: 100%; position: relative; font-family: Poppins, sans-serif; color: #1d1d1f; }
  .clip { position: absolute; inset: 0; }

  /* header */
  #kicker { position: absolute; left: 70px; top: 118px; font-family: Inter, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: .16em; color: #8a8478; }
  #headline { position: absolute; left: 70px; top: 182px; width: 950px; font-weight: 800; font-size: 84px; line-height: 1.04; letter-spacing: -.02em; }
  .hl-row { display: block; overflow: hidden; padding-bottom: 6px; }
  .hl-w { display: inline-block; margin-right: 22px; }
  .hl-w.blue { color: #1f6fe5; }

  /* footage card */
  #card { position: absolute; left: 40px; top: 470px; width: 1000px; height: 617px; border-radius: 36px; overflow: hidden;
          box-shadow: 0 18px 50px rgba(40,30,10,.18); background: #cfe3b7; }
  #footage { position: absolute; left: 0; top: 0; width: 1000px; height: 617px; object-fit: cover; }

  /* 20 s timer */
  #ring { position: absolute; left: 802px; top: 498px; width: 210px; height: 210px; border-radius: 50%; background: #fff;
          box-shadow: 0 10px 28px rgba(0,0,0,.18); }
  #ring svg { position: absolute; left: 0; top: 0; }
  #ring-num { position: absolute; left: 0; top: 46px; width: 210px; text-align: center; font-weight: 800; font-size: 76px; line-height: 1; }
  #ring-lbl { position: absolute; left: 0; top: 128px; width: 210px; text-align: center; font-family: Inter, sans-serif; font-weight: 600; font-size: 22px; letter-spacing: .14em; color: #8a8478; }

  /* progress */
  #progress { position: absolute; left: 40px; top: 1112px; width: 1000px; height: 12px; border-radius: 6px; background: #e1d9cb; overflow: hidden; }
  #progress-fill { position: absolute; left: 0; top: 0; width: 1000px; height: 12px; background: #1f6fe5; transform-origin: 0 50%; }

  /* round number */
  .round { position: absolute; left: 290px; top: 520px; width: 500px; height: 520px; text-align: center; font-weight: 900; font-size: 440px; line-height: 520px;
           color: #ffcf3f; -webkit-text-stroke: 14px #1d1d1f; paint-order: stroke fill; opacity: 0; }
  .round-cap { position: absolute; left: 140px; top: 960px; width: 800px; text-align: center; font-weight: 800; font-size: 54px; color: #fff;
               text-shadow: 0 3px 0 #1d1d1f, 0 6px 22px rgba(0,0,0,.55); opacity: 0; }

  /* lyrics */
  #lyrics { position: absolute; left: 0; top: 1176px; width: 1080px; height: 300px; }
  .line { position: absolute; left: 60px; top: 70px; width: 960px; text-align: center; opacity: 0; }
  .w { display: inline-block; position: relative; margin: 0 14px 18px; }
  .w-in { display: inline-block; font-weight: 800; font-size: 88px; line-height: 1.05; color: #bfb6a6; }
  .bub { position: absolute; left: 50%; top: -58px; width: 50px; height: 50px; margin-left: -25px; border-radius: 50%;
         background: radial-gradient(circle at 32% 30%, #ffffff 0 18%, #d8efff 19% 55%, #8ccaff 100%); border: 3px solid #5aa9f5; opacity: 0; }

  /* board */
  #board-lbl { position: absolute; left: 70px; top: 1500px; font-family: Inter, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: .16em; color: #8a8478; }
  .slot { position: absolute; top: 1556px; width: 232px; height: 150px; border-radius: 26px; border: 4px dashed #d3cabb; background: rgba(255,255,255,.55); }
  .slot-w { position: absolute; left: 0; top: 0; width: 232px; height: 150px; line-height: 150px; text-align: center; font-weight: 800; font-size: 46px; opacity: 0; }
  .slot-x2 { position: absolute; left: 172px; top: -22px; width: 74px; height: 50px; border-radius: 25px; background: #1f6fe5; color: #fff;
             text-align: center; line-height: 50px; font-weight: 800; font-size: 28px; opacity: 0; }
  .fly { position: absolute; left: 90px; top: 690px; width: 900px; height: 180px; line-height: 180px; text-align: center; font-weight: 900; font-size: 150px;
         color: #fff; -webkit-text-stroke: 10px #1d1d1f; paint-order: stroke fill; opacity: 0; }

  /* outro */
  #outro { position: absolute; left: 60px; top: 1226px; width: 960px; text-align: center; font-weight: 800; font-size: 76px; line-height: 1.1; opacity: 0; }
  #outro b { color: #1f6fe5; }
  #credit { position: absolute; left: 70px; top: 1800px; width: 940px; font-family: Inter, sans-serif; font-weight: 500; font-size: 22px; color: #9a9385; line-height: 1.45; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30.8" data-width="1080" data-height="1920">

  <section id="head" class="clip" data-start="0" data-duration="30.8" data-track-index="3">
    <div id="kicker">THE 20-SECOND RULE</div>
    <div id="headline">
      <span class="hl-row"><span class="hl-w">Sing</span><span class="hl-w">it</span><span class="hl-w blue">twice.</span></span>
      <span class="hl-row"><span class="hl-w">That's</span><span class="hl-w blue">20</span><span class="hl-w blue">seconds.</span></span>
    </div>
  </section>

  <div id="card">
    <video id="footage" src="assets/cat.mp4" data-start="0" data-duration="30.8" data-track-index="0" muted playsinline></video>
  </div>
  <audio id="song" src="assets/song.mp3" data-start="0" data-duration="30.8" data-track-index="1" data-volume="1"></audio>

  <section id="overlay" class="clip" data-start="0" data-duration="30.8" data-track-index="4">
    <div id="ring">
      <svg width="210" height="210" viewBox="0 0 210 210">
        <circle cx="105" cy="105" r="92" fill="none" stroke="#ece5d8" stroke-width="14" />
        <circle id="ring-arc" cx="105" cy="105" r="92" fill="none" stroke="#1f6fe5" stroke-width="14" stroke-linecap="round"
                stroke-dasharray="578.05" stroke-dashoffset="578.05" transform="rotate(-90 105 105)" />
      </svg>
      <div id="ring-num">0</div>
      <div id="ring-lbl">SECONDS</div>
    </div>
    <div id="progress"><div id="progress-fill"></div></div>
    <div class="round" id="round1">1</div><div class="round-cap" id="round1cap">first time through</div>
    <div class="round" id="round2">2</div><div class="round-cap" id="round2cap">second time through</div>

    <div id="lyrics"></div>

    <div id="board-lbl">WHAT THE SONG TELLS YOU</div>
    <div id="slots"></div>
    <div id="flies"></div>

    <div id="outro">2 times through<br><b>21 seconds</b> of singing</div>
    <div id="credit">Footage &amp; song: CDC "Happy Handwashing Song", public domain. Edit: HTML + GSAP, rendered with HyperFrames.</div>
  </section>
</div>

<script>
  // Word timings: Groq whisper-large-v3 word timestamps, text corrected against lyrics.txt
  // ("and"→"hands", "sell"→"well"). Regenerate with scripts/align-lyrics.mjs.
  const TRANSCRIPT = [{"text": "Wash", "start": 2.98, "end": 3.14}, {"text": "hands", "start": 3.14, "end": 3.84}, {"text": "well", "start": 3.84, "end": 4.3}, {"text": "each", "start": 4.3, "end": 4.78}, {"text": "day", "start": 4.78, "end": 5.34}, {"text": "to", "start": 5.34, "end": 6.04}, {"text": "keep", "start": 6.04, "end": 6.7}, {"text": "germs", "start": 6.7, "end": 7.2}, {"text": "away", "start": 7.2, "end": 8.06}, {"text": "Scrub", "start": 8.7, "end": 9.06}, {"text": "with", "start": 9.06, "end": 9.52}, {"text": "soap", "start": 9.52, "end": 10.06}, {"text": "and", "start": 10.06, "end": 10.44}, {"text": "water", "start": 10.44, "end": 11.14}, {"text": "and", "start": 11.14, "end": 11.96}, {"text": "be", "start": 11.96, "end": 12.3}, {"text": "on", "start": 12.3, "end": 12.82}, {"text": "your", "start": 12.82, "end": 13.22}, {"text": "way", "start": 13.22, "end": 13.66}, {"text": "Wash", "start": 14.36, "end": 14.7}, {"text": "hands", "start": 14.7, "end": 15.18}, {"text": "well", "start": 15.18, "end": 15.62}, {"text": "each", "start": 15.62, "end": 15.98}, {"text": "day", "start": 15.98, "end": 16.56}, {"text": "to", "start": 16.56, "end": 17.24}, {"text": "keep", "start": 17.24, "end": 17.8}, {"text": "germs", "start": 17.8, "end": 18.3}, {"text": "away", "start": 18.3, "end": 18.96}, {"text": "Scrub", "start": 19.72, "end": 20.08}, {"text": "with", "start": 20.08, "end": 20.48}, {"text": "soap", "start": 20.48, "end": 20.96}, {"text": "and", "start": 20.96, "end": 21.42}, {"text": "water", "start": 21.42, "end": 21.98}, {"text": "and", "start": 21.98, "end": 22.8}, {"text": "be", "start": 22.8, "end": 23.16}, {"text": "on", "start": 23.16, "end": 23.66}, {"text": "your", "start": 23.66, "end": 24.1}, {"text": "way", "start": 24.1, "end": 24.48}];

  const LINES = [[0, 4], [5, 8], [9, 13], [14, 18], [19, 23], [24, 27], [28, 32], [33, 37]];
  const SLOTS = [
    { word: 'WASH',  first: 0,  second: 19 },
    { word: 'SCRUB', first: 9,  second: 28 },
    { word: 'SOAP',  first: 11, second: 30 },
    { word: 'WATER', first: 13, second: 32 },
  ];
  const SING_START = TRANSCRIPT[0].start;
  const SING_END = TRANSCRIPT[TRANSCRIPT.length - 1].end;
  const END = 30.8;

  // ---- build DOM (static layout, no measuring needed) ----
  const lyrics = document.getElementById('lyrics');
  LINES.forEach(([a, b], li) => {
    const line = document.createElement('div');
    line.className = 'line'; line.id = 'line' + li;
    for (let i = a; i <= b; i++) {
      const w = document.createElement('span'); w.className = 'w';
      const inner = document.createElement('span'); inner.className = 'w-in'; inner.id = 'w' + i;
      inner.textContent = TRANSCRIPT[i].text + (i === b && (li % 2 === 1) ? '.' : '');
      const bub = document.createElement('span'); bub.className = 'bub'; bub.id = 'b' + i;
      w.appendChild(bub); w.appendChild(inner); line.appendChild(w);
    }
    lyrics.appendChild(line);
  });
  const slotsEl = document.getElementById('slots'), fliesEl = document.getElementById('flies');
  const SLOT_W = 232, SLOT_GAP = 24, SLOT_Y = 1556;
  SLOTS.forEach((s, i) => {
    const slot = document.createElement('div'); slot.className = 'slot'; slot.id = 'slot' + i;
    slot.style.left = (40 + i * (SLOT_W + SLOT_GAP)) + 'px';
    slot.innerHTML = `<div class="slot-w" id="sw${i}">${s.word}</div><div class="slot-x2" id="sx${i}">×2</div>`;
    slotsEl.appendChild(slot);
    const fly = document.createElement('div'); fly.className = 'fly'; fly.id = 'fly' + i; fly.textContent = s.word;
    fliesEl.appendChild(fly);
  });

  // ---- timeline ----
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // intro headline: masked word reveal
  gsap.utils.toArray('.hl-w').forEach((el, i) => {
    tl.fromTo(el, { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: 'power3.out' }, 0.15 + i * 0.12);
  });
  tl.fromTo('#kicker', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.05);
  tl.fromTo('#card', { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'power3.out' }, 0.3);
  tl.fromTo('#ring', { scale: 0 }, { scale: 1, duration: 0.5, ease: 'back.out(2)' }, 0.8);
  tl.fromTo('.slot', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out', stagger: 0.08 }, 1.0);
  tl.fromTo('#board-lbl', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.0);

  // progress bar over the whole video
  tl.fromTo('#progress-fill', { scaleX: 0 }, { scaleX: 1, duration: END, ease: 'none' }, 0);

  // 20 s timer: ring + counter run while the song is sung. The counter shows whole seconds:
  // a value that runs 0.5 s behind, rounded by snap, so no callback writes to the DOM.
  const singDur = SING_END - SING_START;
  tl.fromTo('#ring-arc', { strokeDashoffset: 578.05 }, { strokeDashoffset: 0, duration: singDur, ease: 'none' }, SING_START);
  tl.fromTo('#ring-num', { textContent: 0 }, { textContent: singDur - 0.5, snap: { textContent: 1 }, duration: singDur - 0.5, ease: 'none' }, SING_START + 0.5);
  tl.to('#ring', { scale: 1.12, duration: 0.18, ease: 'power2.out' }, SING_END);
  tl.to('#ring', { scale: 1, duration: 0.3, ease: 'power2.inOut' }, SING_END + 0.18);

  // giant round numbers before each pass
  [['#round1', '#round1cap', SING_START - 1.05], ['#round2', '#round2cap', TRANSCRIPT[19].start - 0.75]].forEach(([n, c, t]) => {
    tl.fromTo(n, { opacity: 1, scale: 0 }, { scale: 1, duration: 0.32, ease: 'back.out(2.2)' }, t);
    tl.fromTo(c, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.25 }, t + 0.1);
    tl.to([n, c], { opacity: 0, y: -60, duration: 0.25, ease: 'power2.in' }, t + 0.72);
  });

  // karaoke: one line at a time, every word lights up when sung, a bubble pops above it
  LINES.forEach(([a, b], li) => {
    const tin = TRANSCRIPT[a].start - 0.3;
    const tout = li < LINES.length - 1 ? TRANSCRIPT[LINES[li + 1][0]].start - 0.3 : SING_END + 0.5;
    tl.fromTo('#line' + li, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out' }, tin);
    tl.to('#line' + li, { opacity: 0, y: -30, duration: 0.18, ease: 'power2.in' }, tout - 0.02);
    for (let i = a; i <= b; i++) {
      const w = TRANSCRIPT[i];
      tl.fromTo('#w' + i, { color: '#bfb6a6', scale: 1 }, { color: '#1d1d1f', scale: 1.1, duration: 0.1, ease: 'power2.out' }, w.start);
      tl.to('#w' + i, { scale: 1, duration: 0.22, ease: 'power2.inOut' }, w.start + 0.1);
      tl.fromTo('#b' + i, { opacity: 0, scale: 0.2, y: -24 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: 'back.out(3)' }, w.start);
      tl.to('#b' + i, { opacity: 0, scale: 0.4, duration: 0.12, ease: 'power1.in' }, Math.max(w.start + 0.2, w.end - 0.06));
    }
  });

  // board: the key word pops over the cat and flies into its slot (first pass), gets ×2 (second pass)
  SLOTS.forEach((s, i) => {
    const t = TRANSCRIPT[s.first].start;
    const dx = (40 + i * (SLOT_W + SLOT_GAP) + SLOT_W / 2) - 540;
    const dy = (SLOT_Y + 75) - 780;
    tl.fromTo('#fly' + i, { opacity: 1, scale: 0, x: 0, y: 0 }, { scale: 1, duration: 0.22, ease: 'back.out(2.5)' }, t);
    tl.to('#fly' + i, { x: dx, y: dy, scale: 0.3, duration: 0.42, ease: 'power3.in' }, t + 0.32);
    tl.set('#fly' + i, { opacity: 0 }, t + 0.74);
    tl.fromTo('#sw' + i, { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, t + 0.74);
    tl.to('#slot' + i, { borderColor: '#1d1d1f', backgroundColor: '#ffffff', borderStyle: 'solid', duration: 0.15 }, t + 0.74);
    const t2 = TRANSCRIPT[s.second].start;
    tl.fromTo('#slot' + i, { scale: 1 }, { scale: 1.08, duration: 0.12, ease: 'power2.out', yoyo: true, repeat: 1 }, t2);
    tl.fromTo('#sx' + i, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(3)' }, t2 + 0.05);
  });

  // outro: summary replaces the lyrics
  tl.fromTo('#outro', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, SING_END + 0.6);
  tl.to('.slot', { y: -8, duration: 0.2, ease: 'power2.out', yoyo: true, repeat: 1, stagger: 0.1 }, SING_END + 1.0);

  tl.to({}, { duration: END }, 0);
  window.__timelines.main = tl;
</script>
</body>
</html>
