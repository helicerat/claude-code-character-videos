<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #14122b; }
  #root { width: 100%; height: 100%; position: relative; font-family: Poppins, sans-serif; color: #fff; }
  .clip { position: absolute; inset: 0; }
  #footage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

  #shade { position: absolute; left: 0; top: 0; width: 1080px; height: 640px;
           background: linear-gradient(180deg, rgba(20,18,43,.6) 0%, rgba(20,18,43,0) 100%); }
  #hook { position: absolute; left: 60px; top: 150px; width: 960px; text-align: center; font-family: Poppins, sans-serif; font-weight: 900;
          font-size: 104px; line-height: 1.02; color: #fff; text-shadow: 0 6px 0 #2d2470, 0 12px 30px rgba(0,0,0,.35); }
  .hw { display: inline-block; margin: 0 12px; }
  #sub { position: absolute; left: 60px; top: 390px; width: 960px; text-align: center; font-family: Inter, sans-serif; font-weight: 600;
         font-size: 38px; color: #d9d4ff; }

  .dot { position: absolute; top: 520px; width: 56px; height: 56px; border-radius: 28px; background: rgba(255,255,255,.18);
         border: 4px solid rgba(255,255,255,.6); box-sizing: border-box; }

  .num { position: absolute; left: 240px; top: 760px; width: 600px; height: 420px; line-height: 420px; text-align: center;
         font-family: Poppins, sans-serif; font-weight: 900; font-size: 380px; color: #7cf2c2; -webkit-text-stroke: 16px #2d2470;
         paint-order: stroke fill; opacity: 0; }
  .label { position: absolute; left: 60px; top: 1260px; width: 960px; text-align: center; font-family: Poppins, sans-serif; font-weight: 900;
           font-size: 96px; line-height: 1.05; color: #fff; -webkit-text-stroke: 10px #2d2470; paint-order: stroke fill; opacity: 0; }

  #outro { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #14122b; opacity: 0; }
  #outro-t { position: absolute; left: 60px; top: 760px; width: 960px; text-align: center; font-family: Poppins, sans-serif; font-weight: 900;
             font-size: 120px; line-height: 1.05; color: #7cf2c2; }
  #outro-cta { position: absolute; left: 60px; top: 1060px; width: 960px; text-align: center; font-family: Inter, sans-serif; font-weight: 600;
               font-size: 46px; color: #d9d4ff; }

  #progress { position: absolute; left: 60px; top: 1830px; width: 960px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.3); overflow: hidden; }
  #progress-fill { position: absolute; left: 0; top: 0; width: 960px; height: 12px; background: #7cf2c2; transform-origin: 0 50%; }
  #credit { position: absolute; left: 60px; top: 1858px; width: 960px; font-family: Inter, sans-serif; font-weight: 500; font-size: 19px;
            color: rgba(255,255,255,.8); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
  <video id="footage" src="assets/footage.mp4" data-start="0" data-duration="12" data-track-index="0" muted playsinline></video>
  <audio id="music" src="assets/music.mp3" data-start="0" data-duration="12" data-track-index="1" data-volume="0.9" data-timeline-role="music"></audio>

  <section id="overlay" class="clip" data-start="0" data-duration="12" data-track-index="2">
    <div id="shade"></div>
    <div id="hook"><span class="hw">Four</span><span class="hw">moments,</span><br><span class="hw">one</span><span class="hw">video</span></div>
    <div id="sub">edit marks.json, rebuild, watch them move</div>
    <div id="dots"></div>
    <div id="nums"></div>
    <div id="labels"></div>
    <div id="outro">
      <div id="outro-t">Your turn.</div>
      <div id="outro-cta">swap the footage, keep the code</div>
    </div>
    <div id="progress"><div id="progress-fill"></div></div>
    <div id="credit">Placeholder footage made with ffmpeg · Edit: HTML + GSAP, rendered with HyperFrames</div>
  </section>
</div>

<script>
  // Mark times come from marks.json; scripts/build.mjs writes them here. Edit marks.json, not this line.
  const MARKS = /*MARKS*/[];
  // Literal seconds only for the intro, short offsets and the end (AGENTS.md, rule 2).
  const END = 12, OUTRO = 10.2;
  const N = MARKS.length;

  const DOT = 56, GAP = 18, X0 = (1080 - (N * DOT + (N - 1) * GAP)) / 2;
  const dots = document.getElementById('dots'), nums = document.getElementById('nums'), labels = document.getElementById('labels');
  MARKS.forEach((m, i) => {
    const d = document.createElement('div'); d.className = 'dot'; d.id = 'd' + i; d.style.left = (X0 + i * (DOT + GAP)) + 'px'; dots.appendChild(d);
    const n = document.createElement('div'); n.className = 'num'; n.id = 'n' + i; n.textContent = String(i + 1); nums.appendChild(n);
    const l = document.createElement('div'); l.className = 'label'; l.id = 'l' + i; l.textContent = m.label ?? ''; labels.appendChild(l);
  });

  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Intro: everything here starts hidden in CSS or in the from-state, so frame 0 is clean.
  tl.fromTo('#shade', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
  gsap.utils.toArray('.hw').forEach((el, i) => tl.fromTo(el, { y: 50, opacity: 0, scale: 0.7 }, { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 0.2 + i * 0.1));
  tl.fromTo('#sub', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, 0.7);
  tl.fromTo('.dot', { scale: 0 }, { scale: 1, duration: 0.3, ease: 'back.out(2.4)', stagger: 0.06 }, 0.5);

  // One beat per mark: the number pops, the label lands, the dot fills.
  MARKS.forEach((m, i) => {
    tl.fromTo('#n' + i, { opacity: 1, scale: 0, rotation: -10 }, { scale: 1, rotation: 0, duration: 0.25, ease: 'back.out(2.6)' }, m.t - 0.15);
    tl.to('#n' + i, { opacity: 0, scale: 1.2, duration: 0.2, ease: 'power1.in' }, m.t + 0.75);
    tl.fromTo('#l' + i, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' }, m.t);
    tl.to('#l' + i, { opacity: 0, duration: 0.2 }, m.t + 0.9);
    tl.to('#d' + i, { backgroundColor: '#7cf2c2', borderColor: '#2d2470', duration: 0.1 }, m.t);
    tl.to('#d' + i, { scale: 1.35, duration: 0.1, ease: 'power2.out', yoyo: true, repeat: 1 }, m.t);
  });

  tl.fromTo('#progress-fill', { scaleX: 0 }, { scaleX: 1, duration: END, ease: 'none' }, 0);

  tl.to(['#hook', '#sub'], { opacity: 0, duration: 0.2 }, OUTRO - 0.2);
  tl.fromTo('#outro', { opacity: 0 }, { opacity: 1, duration: 0.3 }, OUTRO);
  tl.fromTo('#outro-t', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, OUTRO + 0.15);
  tl.fromTo('#outro-cta', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3 }, OUTRO + 0.45);

  tl.to({}, { duration: END }, 0);
  window.__timelines.main = tl;
</script>
</body>
</html>
